---
name: Lint package configs

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
    paths:
      - ".scripts/**/*PKGBUILD*"
      - ".github/workflows/lint-package-config.yml"
  pull_request:
    paths:
      - ".scripts/**/*PKGBUILD*"
      - ".github/workflows/lint-package-config.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pkgbuild:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-arch-pkgbuild.yml@13dce11f125107b83ea662167f1091d070dcd359 # 20261114.0
