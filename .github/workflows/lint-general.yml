---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lint:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-general.yml@996dd60d03b12f28b482074a9eed7083a18e2439 # 20261013.1
    with:
      lint-markdown: true
      lint-yaml: true
      lint-actions: true

  jsonlint:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@996dd60d03b12f28b482074a9eed7083a18e2439 # 20261013.1

  markdown-links:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@996dd60d03b12f28b482074a9eed7083a18e2439 # 20261013.1

  shellcheck:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@996dd60d03b12f28b482074a9eed7083a18e2439 # 20261013.1
    with:
      scandir: ./.scripts
      severity: warning
