---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lint:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-general.yml@2fb2fa1ffdd2f4808768bf86828482660e366a13 # 20261008.3
    with:
      lint-markdown: true
      lint-yaml: true
      lint-actions: true

  jsonlint:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@2fb2fa1ffdd2f4808768bf86828482660e366a13 # 20261008.3

  markdown-links:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@2fb2fa1ffdd2f4808768bf86828482660e366a13 # 20261008.3

  shellcheck:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@2fb2fa1ffdd2f4808768bf86828482660e366a13 # 20261008.3
    with:
      scandir: ./.scripts
      severity: warning
