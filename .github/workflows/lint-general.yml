---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lint:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-general.yml@4684bb98d86ce0367028aa5d72fc8d178b102e63 # 20261012.0
    with:
      lint-markdown: true
      lint-yaml: true
      lint-actions: true

  jsonlint:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@4684bb98d86ce0367028aa5d72fc8d178b102e63 # 20261012.0

  markdown-links:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@4684bb98d86ce0367028aa5d72fc8d178b102e63 # 20261012.0

  shellcheck:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@4684bb98d86ce0367028aa5d72fc8d178b102e63 # 20261012.0
    with:
      scandir: ./.scripts
      severity: warning
