---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lint:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-general.yml@271a88a8ebedd8166c86c1aec827ea864a284bcc # 20261010.0
    with:
      lint-markdown: true
      lint-yaml: true
      lint-actions: true

  jsonlint:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@271a88a8ebedd8166c86c1aec827ea864a284bcc # 20261010.0

  markdown-links:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@271a88a8ebedd8166c86c1aec827ea864a284bcc # 20261010.0

  shellcheck:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@271a88a8ebedd8166c86c1aec827ea864a284bcc # 20261010.0
    with:
      scandir: ./.scripts
      severity: warning
