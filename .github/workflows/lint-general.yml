---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lint:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-general.yml@5451f6867a5cb2b9b6318a82e00f7dd9f9fc279a # 20261116.0
    with:
      lint-markdown: true
      lint-yaml: true
      lint-actions: true

  jsonlint:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@5451f6867a5cb2b9b6318a82e00f7dd9f9fc279a # 20261116.0

  markdown-links:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@5451f6867a5cb2b9b6318a82e00f7dd9f9fc279a # 20261116.0

  shellcheck:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@5451f6867a5cb2b9b6318a82e00f7dd9f9fc279a # 20261116.0
    with:
      scandir: ./.scripts
      severity: warning
