---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lint:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-general.yml@816cb358079216167ccd46c8b55bd1386a57116a # 20261013.0
    with:
      lint-markdown: true
      lint-yaml: true
      lint-actions: true

  jsonlint:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@816cb358079216167ccd46c8b55bd1386a57116a # 20261013.0

  markdown-links:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@816cb358079216167ccd46c8b55bd1386a57116a # 20261013.0

  shellcheck:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@816cb358079216167ccd46c8b55bd1386a57116a # 20261013.0
    with:
      scandir: ./.scripts
      severity: warning
