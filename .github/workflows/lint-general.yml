---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lint:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-general.yml@f39552735dd1e0766144bfd674cd5d11af1676c9 # 20261108.2
    with:
      lint-markdown: true
      lint-yaml: true
      lint-actions: true

  jsonlint:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@f39552735dd1e0766144bfd674cd5d11af1676c9 # 20261108.2

  markdown-links:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@f39552735dd1e0766144bfd674cd5d11af1676c9 # 20261108.2

  shellcheck:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@f39552735dd1e0766144bfd674cd5d11af1676c9 # 20261108.2
    with:
      scandir: ./.scripts
      severity: warning
