---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lint:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-general.yml@9bb6ae3c2a1542cec4195b63f9516c83001e578e # 20261113.0
    with:
      lint-markdown: true
      lint-yaml: true
      lint-actions: true

  jsonlint:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@9bb6ae3c2a1542cec4195b63f9516c83001e578e # 20261113.0

  markdown-links:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@9bb6ae3c2a1542cec4195b63f9516c83001e578e # 20261113.0

  shellcheck:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@9bb6ae3c2a1542cec4195b63f9516c83001e578e # 20261113.0
    with:
      scandir: ./.scripts
      severity: warning
