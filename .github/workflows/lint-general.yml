---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lint:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-general.yml@fa479eabebf26cc5f655b165c20423fb8fcc0cf4 # 20261115.0
    with:
      lint-markdown: true
      lint-yaml: true
      lint-actions: true

  jsonlint:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@fa479eabebf26cc5f655b165c20423fb8fcc0cf4 # 20261115.0

  markdown-links:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@fa479eabebf26cc5f655b165c20423fb8fcc0cf4 # 20261115.0

  shellcheck:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@fa479eabebf26cc5f655b165c20423fb8fcc0cf4 # 20261115.0
    with:
      scandir: ./.scripts
      severity: warning
