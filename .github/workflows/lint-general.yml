---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lint:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-general.yml@fcc6d0528cf0533614d1162c5c5b8ebbb6dfdad5 # 20261008.1
    with:
      lint-markdown: true
      lint-yaml: true
      lint-actions: true

  jsonlint:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@fcc6d0528cf0533614d1162c5c5b8ebbb6dfdad5 # 20261008.1

  markdown-links:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@fcc6d0528cf0533614d1162c5c5b8ebbb6dfdad5 # 20261008.1

  shellcheck:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@fcc6d0528cf0533614d1162c5c5b8ebbb6dfdad5 # 20261008.1
    with:
      scandir: ./.scripts
      severity: warning
