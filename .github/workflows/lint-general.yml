---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lint:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-general.yml@8093949b6c3d684adde3812ddcfd96c6ef77f4b6 # 20261108.0
    with:
      lint-markdown: true
      lint-yaml: true
      lint-actions: true

  jsonlint:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@8093949b6c3d684adde3812ddcfd96c6ef77f4b6 # 20261108.0

  markdown-links:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@8093949b6c3d684adde3812ddcfd96c6ef77f4b6 # 20261108.0

  shellcheck:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@8093949b6c3d684adde3812ddcfd96c6ef77f4b6 # 20261108.0
    with:
      scandir: ./.scripts
      severity: warning
