---
name: Lint general

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lint:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-general.yml@6e3616d0d48c9c8ed9865b648107140b99b16551 # 20261024.0
    with:
      lint-markdown: true
      lint-yaml: true
      lint-actions: true

  jsonlint:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@6e3616d0d48c9c8ed9865b648107140b99b16551 # 20261024.0

  markdown-links:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-markdown-links.yml@6e3616d0d48c9c8ed9865b648107140b99b16551 # 20261024.0

  shellcheck:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-shellcheck.yml@6e3616d0d48c9c8ed9865b648107140b99b16551 # 20261024.0
    with:
      scandir: ./.scripts
      severity: warning
