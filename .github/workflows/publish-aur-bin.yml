---
name: Package stable release

# yamllint disable-line rule:truthy
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release-version:
        description: Stable GitHub Release tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: >-
    publish-aur-bin-${{
      inputs.release-version || github.event.release.tag_name
    }}
  cancel-in-progress: false

jobs:
  package:
    name: Build and attach release packages
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !github.event.release.prerelease
    permissions:
      contents: write
      id-token: write
      attestations: write
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/release-bun-cli-linux.yml@82ee28374d3471231113dabc3dd436f65a47132f # 20261004.0
    with:
      binary-name: float-app
      entrypoint: src/index.ts
      package-config: .scripts/linux/nfpm.yaml
      bun-version: 1.4.2
      smoke-test-arguments: --version
      release-version: >-
        ${{ inputs.release-version || github.event.release.tag_name }}
      source-ref: >-
        ${{ inputs.release-version || github.event.release.tag_name }}
      existing-release: true
      attest: true

  prepare:
    name: Prepare Arch package (float-app-bin)
    needs: package
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: >-
        ${{ inputs.release-version || github.event.release.tag_name }}
    steps:
      - name: Check out release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.RELEASE_VERSION }}
          persist-credentials: false
      - name: Render PKGBUILD
        # yamllint disable-line rule:line-length
        uses: timmo001/workflows/.github/actions/prepare-arch-bin@82ee28374d3471231113dabc3dd436f65a47132f # 20261004.0
        with:
          releaseVersion: ${{ env.RELEASE_VERSION }}
          packageName: float-app
          pkgbuildTemplate: .scripts/linux/PKGBUILD.bin
          outputDirectory: ${{ runner.temp }}/arch-bin
          completionsArguments: completions {shell}
          extraFiles: LICENSE
      - name: Upload package files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: >-
            arch-float-app-bin-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/arch-bin
          if-no-files-found: error
          retention-days: 1

  publish-arch:
    name: Publish Arch package (float-app-bin)
    needs: prepare
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/build-arch-package.yml@82ee28374d3471231113dabc3dd436f65a47132f # 20261004.0
    with:
      package-name: float-app-bin
      # yamllint disable-line rule:line-length
      package-files-artifact-name: arch-float-app-bin-${{ github.run_id }}-${{ github.run_attempt }}
      pkgbuild-path: PKGBUILD
    secrets:
      ARCH_REPO_DISPATCH_TOKEN: ${{ secrets.ARCH_REPO_DISPATCH_TOKEN }}

  attach-arch:
    name: Attach Arch package (float-app-bin)
    needs: publish-arch
    permissions:
      contents: write
      id-token: write
      attestations: write
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/attach-release-arch-package.yml@82ee28374d3471231113dabc3dd436f65a47132f # 20261004.0
    with:
      artifact-name: ${{ needs.publish-arch.outputs.artifact-name }}
      release-tag: >-
        ${{ inputs.release-version || github.event.release.tag_name }}
      package-name: float-app-bin

  publish:
    name: Publish AUR (float-app-bin)
    needs: prepare
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/publish-aur.yml@82ee28374d3471231113dabc3dd436f65a47132f # 20261004.0
    with:
      package-name: float-app-bin
      artifact-name: >-
        arch-float-app-bin-${{ github.run_id }}-${{ github.run_attempt }}
      auxiliary-file-paths: |-
        float-app.bash
        float-app.fish
        _float-app
        LICENSE
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
