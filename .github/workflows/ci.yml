---
name: CI

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/build-bun-cli.yml@5451f6867a5cb2b9b6318a82e00f7dd9f9fc279a # 20261116.0
    with:
      smoke-test: ./dist/float-app --version
