---
name: CI

# yamllint disable-line rule:truthy
on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/lint-oxlint.yml@a7b34d53ef8f83b1763fd0d3257a0168416e23ab # 20261001.2
  build:
    # yamllint disable-line rule:line-length
    uses: timmo001/workflows/.github/workflows/build-bun-cli.yml@a7b34d53ef8f83b1763fd0d3257a0168416e23ab # 20261001.2
    with:
      smoke-test: ./dist/float-app --version
