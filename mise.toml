min_version = "2025.1.0"

[tools]
node = "26.13.0"
bun = "1.4.4"
"npm:@timmo001/tooling-drift" = { version = "0.1.7", allow_low_downloads = true }

[tasks.install]
description = "Install float-app dependencies"
run = "bun install"

[tasks.dev]
description = "Run float-app in watch mode"
depends = ["install"]
run = "bun run dev"

[tasks.build]
description = "Compile the float-app binary"
depends = ["install"]
run = "bun run build"

[tasks.typecheck]
description = "Type-check float-app"
depends = ["install"]
run = "bunx tsc --noEmit"

[tasks.test]
description = "Run float-app tests"
depends = ["install"]
run = "bun test"

[tasks.lint]
description = "Lint source, tests, and scripts"
depends = ["install"]
run = "bun run lint"

[tasks.format]
description = "Format source and tests"
depends = ["install"]
run = "bun run format"

[tasks."format:check"]
description = "Check formatting"
depends = ["install"]
run = "bun run format:check"

[tasks.completions]
description = "Generate shell completions"
depends = ["install"]
run = "bun run completions"

[tasks."docs:install"]
description = "Install documentation dependencies"
run = "bun install --cwd docs"

[tasks."docs:gen:cli"]
description = "Generate the CLI reference"
depends = ["docs:install"]
run = "bun run --cwd docs gen:cli"

[tasks."docs:sync"]
description = "Generate Astro types"
depends = ["docs:install"]
run = "bun run --cwd docs astro sync"

[tasks."docs:typecheck"]
description = "Type-check documentation TypeScript"
depends = ["install", "docs:sync"]
run = "bunx tsc --noEmit --project docs/tsconfig.json"

[tasks."docs:build"]
description = "Build the documentation site"
depends = ["docs:install"]
run = "bun run --cwd docs build"

[tasks."serve:docs"]
description = "Start the docs dev server in the background through Pitchfork"
depends = ["docs:install"]
run = "pitchfork start docs"

[tasks."serve:docs:status"]
description = "Show the background docs dev server status"
run = "pitchfork status docs"

[tasks."serve:docs:logs"]
description = "Follow the background docs dev server logs"
run = "pitchfork logs -t docs"

[tasks."serve:docs:restart"]
description = "Restart the background docs dev server"
run = "pitchfork restart docs"

[tasks."serve:docs:stop"]
description = "Stop the background docs dev server"
run = "pitchfork stop docs"

[tasks."completions:check"]
description = "Check generated shell completions"
depends = ["install"]
run = "bun run completions:check"

[tasks."tooling:status"]
description = "Compare the reviewed Omarchy release in tooling.yml with the latest"
run = "tooling-drift status"

[tasks."tooling:update"]
description = "Record a tool release as reviewed in tooling.yml after reviewing it"
usage = '''
arg "<repo>" help="Tool repository, e.g. omacom/omarchy"
arg "<tag>" help="Release tag, e.g. v4.0.4"
'''
run = "tooling-drift update $usage_repo $usage_tag"

[tasks."tooling:publish"]
description = "Open or refresh a draft review pull request when a newer Omarchy release is out"
run = "tooling-drift publish"

[tasks.check]
description = "Lint, type-check, test, and verify formatting"
depends = ["lint", "typecheck", "docs:typecheck", "test", "format:check", "completions:check"]
