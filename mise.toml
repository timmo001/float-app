min_version = "2025.1.0"

[tools]
node = "26.13.1"
bun = "1.4.5"
# The linters the shared hk pre-push hook runs, matching CI.
hk = "2.13.0"
uv = "0.13.9"
# yamllint's PyYAML has no wheels for newer Pythons, and mise won't build it from source.
python = "3.14.10"
"pipx:yamllint" = "1.38.0"
"npm:markdownlint-cli2" = "0.24.2"
actionlint = "1.7.12"
shellcheck = "0.11.0"

[tasks.install]
description = "Install float-app dependencies"
run = "bun install"

[tasks.dev]
description = "Run float-app in watch mode"
depends = ["install"]
run = "bun run dev"

[tasks.build]
description = "Compile the float-app binary"
depends = ["install"]
run = "bun run build"

[tasks.typecheck]
description = "Type-check float-app"
depends = ["install"]
run = "bunx tsc --noEmit"

[tasks.test]
description = "Run float-app tests"
depends = ["install"]
run = "bun test"

[tasks.lint]
description = "Lint source, tests, and scripts"
depends = ["install"]
run = "bun run lint"

[tasks.format]
description = "Format source and tests"
depends = ["install"]
run = "bun run format"

[tasks."format:check"]
description = "Check formatting"
depends = ["install"]
run = "bun run format:check"

[tasks.completions]
description = "Generate shell completions"
depends = ["install"]
run = "bun run completions"

[tasks."docs:install"]
description = "Install documentation dependencies"
dir = "docs"
run = "bun install --frozen-lockfile"

[tasks."docs:gen:cli"]
description = "Generate the CLI reference"
depends = ["install", "docs:install"]
dir = "docs"
run = "bun run gen:cli"

[tasks."docs:lint"]
description = "Lint the docs site with the shared Oxlint rules"
# The docs scripts import src/cli/spec.ts, which needs the root dependencies.
depends = ["install", "docs:install"]
dir = "docs"
run = "bun run lint"

[tasks."docs:build"]
description = "Build the documentation site"
depends = ["install", "docs:install"]
dir = "docs"
run = "bun run build"

[tasks."docs:check"]
description = "Check the docs site's pages, links and types without disturbing a running dev server"
# Its precheck reinstalls the root dependencies, so wait for install rather than
# racing its effect-tsgo patch.
depends = ["install", "docs:install"]
dir = "docs"
# The tsconfig reads Blume's generated types from .blume/. When it exists a dev
# server may be using it, so check in --isolated's .blume-verify/ and keep
# reading those types; in a fresh checkout such as CI, generate .blume/ itself.
run = "if [ -d .blume ]; then bun run check -- --isolated; else bun run check; fi"

[tasks."docs:plan"]
description = "Build the docs site, then show what deploying its prod stage would change"
depends = ["docs:build"]
dir = "docs"
run = "bun run plan"

[tasks."docs:deploy"]
description = "Build the docs site, then deploy its prod stage with Alchemy"
depends = ["docs:build"]
dir = "docs"
run = "bun run deploy"

[tasks."docs:deploy:github"]
description = "Mint CI's Cloudflare token into the repository's secrets"
depends = ["docs:install"]
dir = "docs"
run = "bun run deploy:github"

[tasks."serve:docs"]
description = "Start the docs dev server in the background through Pitchfork"
depends = ["docs:install"]
run = "pitchfork start docs"

[tasks."serve:docs:status"]
description = "Show the background docs dev server status"
run = "pitchfork status docs"

[tasks."serve:docs:logs"]
description = "Follow the background docs dev server logs"
run = "pitchfork logs -t docs"

[tasks."serve:docs:restart"]
description = "Restart the background docs dev server"
run = "pitchfork restart docs"

[tasks."serve:docs:stop"]
description = "Stop the background docs dev server"
run = "pitchfork stop docs"

[tasks."completions:check"]
description = "Check generated shell completions"
depends = ["install"]
run = "bun run completions:check"

[tasks.check]
description = "Lint, type-check, test, and verify formatting"
depends = ["lint", "typecheck", "docs:lint", "docs:check", "test", "format:check", "completions:check"]
